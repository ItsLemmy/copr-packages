name: strata update check

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get newest published upstream release (including prereleases)
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            'https://api.github.com/repos/lgse/strata/releases?per_page=100' \
            | jq -r '[.[] | select(.draft == false)] | sort_by(.published_at) | last | .tag_name')
          upstream_version="${tag#v}"
          if [[ ! "$upstream_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|nightly)\.[0-9]+(\.[0-9]+)*)?$ ]]; then
            echo "::error::Unexpected upstream release tag '$tag'"
            exit 1
          fi
          version="${upstream_version/-/\~}"
          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Upstream version: $version"

      - name: Get spec version
        id: spec
        run: |
          version=$(sed -n 's/^Version:[[:space:]]*//p' strata/strata.spec)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Spec version: $version"

      - name: Get latest COPR build version
        id: copr
        run: |
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          status=$(curl -sS -o "$response" -w '%{http_code}' "https://copr.fedorainfracloud.org/api_3/package?ownername=lemmy&projectname=favorites&packagename=strata&with_latest_succeeded_build=True")
          if [[ "$status" == 404 ]]; then
            version=""
          elif [[ "$status" =~ ^2 ]]; then
            version=$(jq -r '.builds.latest_succeeded.source_package.version // ""' "$response" | sed 's/-[^-]*$//')
          else
            cat "$response" >&2
            echo "::error::Could not retrieve the latest COPR build (HTTP $status)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "COPR version: ${version:-none}"

      - name: Verify release tarball checksum
        if: steps.upstream.outputs.version != steps.spec.outputs.version
        run: |
          set -euo pipefail
          v="${{ steps.upstream.outputs.upstream_version }}"
          f="strata-${v}-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/lgse/strata/releases/download/v${v}"
          curl -fL -O "$base/$f"
          curl -fL -O "$base/$f.sha256"
          sha256sum --check "$f.sha256"
          rm -f "$f" "$f.sha256"

      - name: Bump spec and commit
        if: steps.upstream.outputs.version != steps.spec.outputs.version
        run: |
          set -euo pipefail
          sed -i \
            -e "s/^Version:.*/Version:        ${{ steps.upstream.outputs.version }}/" \
            -e "s/^%global upstream_version .*/%global upstream_version ${{ steps.upstream.outputs.upstream_version }}/" \
            strata/strata.spec
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "strata ${{ steps.upstream.outputs.version }}"
          git push

      - name: Trigger COPR build
        if: steps.upstream.outputs.version != steps.copr.outputs.version
        run: |
          echo "Building strata ${{ steps.upstream.outputs.version }} (COPR has: ${{ steps.copr.outputs.version }})"
          sudo pip3 install copr-cli
          mkdir -p ~/.config
          echo "${{ secrets.COPR_CONFIG }}" > ~/.config/copr
          copr-cli build-package --name strata --nowait favorites
          echo "Build triggered."

      - name: No update needed
        if: steps.upstream.outputs.version == steps.copr.outputs.version
        run: echo "Already up to date (${{ steps.copr.outputs.version }})"
