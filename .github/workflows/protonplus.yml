name: protonplus update check

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: protonplus-update
  cancel-in-progress: false

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get latest stable upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/vysp3r/ProtonPlus/releases/latest \
            | jq -r '.tag_name')
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected upstream release tag '$tag'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Upstream version: $version"

      - name: Get spec version
        id: spec
        run: |
          version=$(sed -n 's/^Version:[[:space:]]*//p' protonplus/protonplus.spec)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Spec version: $version"

      - name: Get latest COPR build version
        id: copr
        run: |
          set -euo pipefail
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          status=$(curl -sS -o "$response" -w '%{http_code}' "https://copr.fedorainfracloud.org/api_3/package?ownername=lemmy&projectname=favorites&packagename=protonplus&with_latest_succeeded_build=True")
          if [[ "$status" == 404 ]]; then
            version=""
          elif [[ "$status" =~ ^2 ]]; then
            version=$(jq -r '.builds.latest_succeeded.source_package.version // ""' "$response" | sed 's/-[^-]*$//')
          else
            cat "$response" >&2
            echo "::error::Could not retrieve the latest COPR build (HTTP $status)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "COPR version: ${version:-none}"

      - name: Bump spec and commit
        if: steps.upstream.outputs.version != steps.spec.outputs.version
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          archive=$(mktemp)
          trap 'rm -f "$archive"' EXIT
          curl -fL -o "$archive" "https://github.com/vysp3r/ProtonPlus/archive/refs/tags/v${VERSION}.tar.gz"
          checksum=$(sha256sum "$archive" | cut -d ' ' -f1)
          sed -i \
            -e "s/^%global[[:space:]]*SHA256SUM0 .*/%global SHA256SUM0 $checksum/" \
            -e "s/^Version:.*/Version:    $VERSION/" \
            -e 's/^Release:.*/Release:    1%{?dist}/' \
            protonplus/protonplus.spec
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protonplus/protonplus.spec
          git commit -m "protonplus $VERSION"
          git push

      - name: Trigger COPR build
        if: steps.upstream.outputs.version != steps.copr.outputs.version
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          set -euo pipefail
          sudo pip3 install copr-cli
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
          copr-cli build-package --name protonplus --nowait favorites
          echo "Build triggered."

      - name: No update needed
        if: steps.upstream.outputs.version == steps.copr.outputs.version
        run: echo "Already up to date (${{ steps.copr.outputs.version }})"
