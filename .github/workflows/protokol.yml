name: protokol update check

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: protokol-update
  cancel-in-progress: false

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get latest Linux upstream release
        id: upstream
        run: |
          set -euo pipefail
          curl -fsSL https://hexler.net/protokol/releases -o /tmp/protokol-releases.html
          version=$(python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('/tmp/protokol-releases.html').read_text()
          releases = re.findall(r'href=["\'][^"\']*/protokol/protokol-(\d+\.\d+\.\d+\.\d+)-linux-(x64|arm64)\.deb["\']', html)
          complete = {v for v, arch in releases if all((v, a) in releases for a in ('x64', 'arm64'))}
          if not complete:
              raise SystemExit('No Linux release with both x64 and arm64 Debian packages found')
          print(max(complete, key=lambda v: tuple(map(int, v.split('.')))))
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Upstream version: $version"

      - name: Get spec version
        id: spec
        run: |
          version=$(sed -n 's/^Version:[[:space:]]*//p' protokol/protokol.spec)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Spec version: $version"

      - name: Get latest COPR build version
        id: copr
        run: |
          set -euo pipefail
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          status=$(curl -sS -o "$response" -w '%{http_code}' "https://copr.fedorainfracloud.org/api_3/package?ownername=lemmy&projectname=favorites&packagename=protokol&with_latest_succeeded_build=True")
          if [[ "$status" == 404 ]]; then
            version=""
          elif [[ "$status" =~ ^2 ]]; then
            version=$(jq -r '.builds.latest_succeeded.source_package.version // ""' "$response" | sed 's/-[^-]*$//')
          else
            cat "$response" >&2
            echo "::error::Could not retrieve the latest COPR build (HTTP $status)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "COPR version: ${version:-none}"

      - name: Bump spec and commit
        if: steps.upstream.outputs.version != steps.spec.outputs.version
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          for arch in x64 arm64; do
            file="protokol-${VERSION}-linux-${arch}.deb"
            base="https://downloads.hexler.net/protokol"
            curl -fL -o "$work/$file" "$base/$file"
            curl -fL -o "$work/$file.sha" "$base/$file.sha"
            (cd "$work" && sha256sum --check "$file.sha")
            checksum=$(sha256sum "$work/$file" | cut -d ' ' -f1)
            sed -i "s/^%global SHA256SUM_${arch} .*/%global SHA256SUM_${arch} $checksum/" protokol/protokol.spec
          done
          sed -i \
            -e "s/^Version:.*/Version:        $VERSION/" \
            -e 's/^Release:.*/Release:        1%{?dist}/' \
            protokol/protokol.spec
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protokol/protokol.spec
          git commit -m "protokol $VERSION"
          git push

      - name: Trigger COPR build
        if: steps.upstream.outputs.version != steps.copr.outputs.version
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          set -euo pipefail
          sudo pip3 install copr-cli
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
          copr-cli build-package --name protokol --nowait favorites
          echo "Build triggered."

      - name: No update needed
        if: steps.upstream.outputs.version == steps.copr.outputs.version
        run: echo "Already up to date (${{ steps.copr.outputs.version }})"
